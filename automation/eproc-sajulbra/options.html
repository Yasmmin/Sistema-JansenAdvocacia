<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificador Sajulbra</title>
<style>body{font:14px Arial;max-width:640px;margin:40px auto;color:#122033}label{display:block;margin:18px 0 6px;font-weight:700}input:not([type=checkbox]){width:100%;box-sizing:border-box;padding:10px;border:1px solid #bac4d0;border-radius:7px}.toggle{display:flex;align-items:center;gap:9px}.toggle input{width:18px;height:18px}button{margin-top:18px;padding:10px 18px;border:0;border-radius:7px;background:#0b2138;color:white;font-weight:700}#status{margin-left:12px}</style>
<h1>Verificador Sajulbra no eproc</h1><p>A automação usa apenas regras locais. Nenhum dado é enviado ao ChatGPT.</p>
<label for="api">Endereço do Sistema Jansen</label><input id="api" value="http://127.0.0.1:8787">
<label for="key">Chave da automação</label><input id="key" type="password" autocomplete="off">
<label class="toggle" for="enabled"><input id="enabled" type="checkbox"> Ativar automação contínua</label>
<button id="save">Salvar configuração</button><span id="status"></span><script src="options.js"></script></html>
